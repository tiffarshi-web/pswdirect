name: Worker Android verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/worker-android.yml"
      - "mobile/worker/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.worker.config.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/worker-android.yml"
      - "mobile/worker/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.worker.config.ts"

permissions:
  contents: read

concurrency:
  group: worker-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-worker-android:
    name: Build Worker debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install locked dependencies
        run: npm ci
      - name: Verify shared and Worker source
        run: |
          npm run typecheck
          npm test
          npm run build:worker
      - name: Generate Android project
        run: npm run cap:add:worker:android
      - name: Verify Worker identity
        run: |
          grep -R --fixed-strings "ca.pswdirect.worker" mobile/worker/android/app/src/main
          grep -R --fixed-strings "PSW Direct Worker" mobile/worker/android/app/src/main/res
      - name: Compile debug APK
        working-directory: mobile/worker/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: psw-direct-worker-debug
          path: mobile/worker/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

