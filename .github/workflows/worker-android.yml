name: Worker Android verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/worker-android.yml"
      - "mobile/worker/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.worker.config.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/worker-android.yml"
      - "mobile/worker/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "vite.worker.config.ts"

permissions:
  contents: read

concurrency:
  group: worker-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-worker-android:
    name: Build Worker debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Keep one debug signing identity across CI runs. Without this, each
      # fresh GitHub runner creates a different debug certificate and Android
      # refuses to update a previously installed beta APK.
      - name: Restore Worker debug signing key
        id: worker-debug-key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: psw-worker-debug-signing-v1
      - name: Create Worker debug signing key
        if: steps.worker-debug-key.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=PSW Direct Worker Debug,OU=Mobile,O=PSW Direct,C=CA"
      - name: Install locked dependencies
        run: npm ci
      - name: Verify shared and Worker source
        run: |
          npm run typecheck
          npm test
          npm run build:worker
      - name: Verify Worker app version metadata
        run: |
          grep -E 'WORKER_APP_VERSION = "[0-9]+\.[0-9]+\.[0-9]+"' src/mobile/version.ts
          grep -E 'WORKER_BUILD_NUMBER = [0-9]+' src/mobile/version.ts
      - name: Verify no secrets in the Worker bundle
        run: |
          if grep -REl "SERVICE_ROLE|sk_live_|sk_test_" dist-worker; then
            echo "Secret-shaped value found in the Worker bundle" >&2
            exit 1
          fi
      - name: Generate Android project
        run: npm run cap:add:worker:android
      - name: Verify Worker identity
        run: |
          grep -R --fixed-strings "ca.pswdirect.worker" mobile/worker/android/app/src/main
          grep -R --fixed-strings "PSW Direct Worker" mobile/worker/android/app/src/main/res
      - name: Verify Firebase configuration is installed
        run: |
          test -f mobile/worker/android/app/google-services.json
          node -e "const j=require('./mobile/worker/android/app/google-services.json');if(!j.client.some(c=>c.client_info.android_client_info.package_name==='ca.pswdirect.worker')){throw new Error('google-services.json is not for ca.pswdirect.worker')}"
          grep -q "com.google.gms.google-services" mobile/worker/android/app/build.gradle


      - name: Compile debug APK
        working-directory: mobile/worker/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Verify installable APK
        run: |
          APK="mobile/worker/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | grep --fixed-strings "package: name='ca.pswdirect.worker'"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: psw-direct-worker-debug
          path: mobile/worker/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
